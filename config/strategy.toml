# Strategy parameters (Rust plan §6, D1). Edit and run again; nothing is recompiled.
# Every value here is also the built-in default, so a missing line falls back to it.
# Unknown keys are rejected, so a typo cannot be silently ignored.

markets = ["US"]
rebalance_dates = ["2024-06-30", "2025-06-30", "2026-02-10", "2026-05-01"]

[research]
# The specialists examine this many of the best securities the quant screen kept,
max_candidates = 8
# plus these, even when vetoed, to audit the veto.
audit_tickers = ["TRAP_CO"]
max_positions = 3
portfolio_capital = 100_000_000 # cents, i.e. $1,000,000
worker_cost = 3                 # cents booked per security the specialists examine

[factors]
min_adv_usd = 1_000_000.0
momentum_tiebreak = 0.05

[factors.weights]
valuation = 0.30
quality = 0.20
financial_health = 0.15
earnings_quality = 0.10
cash_flow = 0.10
growth = 0.10
capital_allocation = 0.05

[factors.penalty]
altman_z_below = 2.99
interest_cov_below = 4.0
beneish_m_above = -2.20
accruals_above = 0.05
distress_weight = 0.15
manipulation_weight = 0.15
illiquidity_weight = 0.10

[factors.veto]
altman_z_below = 1.8
interest_cov_below = 1.5
beneish_m_above = -1.78
accruals_quantile = 0.80

[committee]
dispersion_threshold = 0.45
escalation_consensus_floor = -0.10
max_single_weight = 3500   # bps
max_industry_weight = 6500 # bps
max_adv_participation = 0.10

[committee.weights]
quant = 0.45
moat = 0.20
management_capalloc = 0.15
footnote_forensics = 0.20

# The three specialists (D1). Weights, the size of a signal that counts as full, what a
# keyword hit is worth, the keywords themselves, and how far a specialist trusts itself
# without filings. These are the Python MVP's values; changing them needs no recompile.
[specialists.moat]
roic_spread_weight = 0.45
roic_spread_full = 0.12     # ROIC minus WACC that counts as +1
gp_assets_weight = 0.30
sales_cagr_weight = 0.15
sales_cagr_full = 0.10      # three-year sales growth that counts as +1
per_positive_hit = 0.10
per_negative_hit = 0.18
max_hits = 2

[specialists.moat.filings]
positive = ["pricing power", "switching cost", "network effect", "high retention", "installed base", "scale advantage"]
negative = ["margin compression", "commoditized", "price war", "customer churn", "lost market share"]
missing_without_filings = 0.25
confidence_floor = 0.10

[specialists.management_capalloc]
net_issuance_weight = 0.35
net_issuance_full = 0.04
insider_buying_weight = 0.25
insider_buying_full_usd = 1_000_000.0
dilution_weight = 0.25
dilution_full = 0.03        # stock-based pay as a share of market value
goodwill_jump_weight = 0.35
goodwill_jump_full = 0.15   # rise in goodwill as a share of assets
per_positive_hit = 0.10
per_negative_hit = 0.15
max_hits = 2

[specialists.management_capalloc.filings]
positive = ["roic-linked", "disciplined buyback", "insider purchase", "debt reduction", "dividend growth"]
negative = ["overpaid acquisition", "goodwill impairment", "aggressive dilution", "insider selling", "related-party"]
missing_without_filings = 0.20
confidence_floor = 0.10

[specialists.footnote_forensics]
beneish_m_veto_above = -1.78 # with operating cash flow at most cfo_veto_at_most
cfo_veto_at_most = 0.0
accruals_weight = 0.35
cfo_ni_weight = 0.35
beneish_weight = 0.30
red_flag_score = -1.0
clean_bonus = 0.10

[specialists.footnote_forensics.filings]
positive = ["unqualified audit", "conservative accounting", "cash conversion"]
negative = ["restatement", "material weakness", "sec investigation", "bill-and-hold", "going concern"]
missing_without_filings = 0.25
confidence_floor = 0.10

# The backtest uses the markets and factor settings above.
[backtest]
top_n = 3
portfolio_capital = 100_000_000 # cents
one_way_cost = 15               # bps
max_adv_participation = 0.10
max_single_weight = 0.40
buffer_band_pct = 0.20
oos_start_date = "2026-02-10"
