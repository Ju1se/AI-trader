[workspace]
resolver = "2"
members = [
    "crates/trade-core",
    "crates/trade-quant",
    "crates/trade-research",
    "crates/trade-gate",
    "crates/trade-adapters",
    "crates/trade-store",
    "crates/trade-server",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
toml = "0.8"
axum = "0.8"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
# Plain HTTP for a model next to the server; add "rustls-tls" for hosted HTTPS endpoints.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
