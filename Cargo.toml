[workspace]
resolver = "2"
members = [
    "crates/trade-core",
    "crates/trade-quant",
    "crates/trade-workers",
    "crates/trade-gate",
    "crates/trade-broker",
    "crates/trade-store",
    "crates/trade-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
